<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIE Studio - Digital Business Card</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin: 10px 0 5px 0;
        }
        p.tagline {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,123,255,0.2);
        }
        .btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
        .btn.facebook { background: #1877f2; }
        .btn.tiktok { background: #010101; }
        .btn.viber { background: #7360f2; }
        .btn.phone { background: #28a745; }
        .btn.save { background: #ffc107; color: #333; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Logo -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Logo" class="logo">
        
        <h1>OIE Photo Studio</h1>
        <p class="tagline">Professional Photography & Wedding Services</p>

        <!-- ခလုတ်များ -->
        <a href="tel:09912345678" class="btn phone">📞 ဖုန်းခေါ်ရန် (Call Now)</a>
        <a href="https://facebook.com" target="_blank" class="btn facebook">📘 Facebook Page သို့ဝင်ရန်</a>
        <a href="https://tiktok.com" target="_blank" class="btn tiktok">🎵 TikTok သို့သွားရန်</a>
        <a href="viber://chat?number=%2B959912345678" class="btn viber">💬 Viber ဖြင့် ဆက်သွယ်ရန်</a>
        <a href="#" class="btn save">💾 ဖုန်းနံပါတ် သိမ်းဆည်းရန် (Save Contact)</a>
    </div>

</body>
</html>
