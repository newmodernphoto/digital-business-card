<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newmodern - Digital Business Card</title>
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin: 10px 0 5px 0;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.2s;
            box-sizing: border-box;
        }
        .call-btn { background-color: #28a745; }
        .fb-btn { background-color: #1877f2; }
        .tiktok-btn { background-color: #000000; }
        .viber-btn { background-color: #7360f2; }
	.telegram-btn { background-color: #0088cc; }
        .save-btn { background-color: #ffc107; color: #333; }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Profile Image (GitHub ထဲက profile.jpg ကို ချိတ်ဆက်ထားသည်) -->
        <img src="profile.jpg" alt="Profile" class="profile-img">
        
        <h1>Newmodern</h1>
        <p>Professional Photography & Wedding Services</p>

        <!-- Action Buttons -->
        <a href="tel:09882299641" class="btn call-btn">📞 ဖုန်းခေါ်ရန် (Call Now)</a>
        <a href="https://www.facebook.com/share/1UWKyKQKJK/?mibextid=wwXIfr" class="btn fb-btn">📘 Facebook Page သို့ဝင်ရန်</a>
        <a href="https://www.tiktok.com/@snowfy2016?_r=1&_t=ZP-9BJPOo8Jt4Z" class="btn tiktok-btn">🎵 TikTok သို့သွားရန်</a>
        <a href="viber://add?number=959882299641" class="btn viber-btn">💬 Viber ဖြင့် ဆက်သွယ်ရန်</a>
	<a href="https://t.me/+959882299641" class="btn telegram-btn">✈️ Telegram ဖြင့် ဆက်သွယ်ရန်</a>
        <a href="contact.vcf" class="btn save-btn">💾 ဖုန်းနံပါတ် သိမ်းဆည်းရန် (Save Contact)</a>
    </div>

</body>
</html>
